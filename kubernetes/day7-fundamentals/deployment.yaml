apiVersion: apps/v1
kind: Deployment

metadata:
  name: day7-nginx-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: day7-nginx

  template:
    metadata:
      labels:
        app: day7-nginx

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
