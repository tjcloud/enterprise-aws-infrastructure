apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-fundamentals-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-fundamentals

  template:
    metadata:
      labels:
        app: nginx-fundamentals

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
