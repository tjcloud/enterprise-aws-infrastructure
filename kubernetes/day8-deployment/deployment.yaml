apiVersion: apps/v1
kind: Deployment

metadata:
  name: day8-nginx-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: day8-nginx

  template:
    metadata:
      labels:
        app: day8-nginx

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "250m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
